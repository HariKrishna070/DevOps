apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-frontend-deployment
  labels:
    app: my-app-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app-frontend
  template:
    metadata:
      labels:
        app: my-app-frontend
    spec:
      containers:
      - name: my-app-frontend
        image: my-app-frontend
        imagePullPolicy: Never
        ports:
        - containerPort: 7860
        env:
        - name: BACKEND_HOST_URL
          value: http://app-backend:8000   
---
apiVersion: v1
kind: Service
metadata:
  name: app-frontend
spec:
  type: NodePort
  selector:
    app: my-app-frontend
  ports:
    - protocol: TCP
      port: 7860
      targetPort: 7860
      nodePort: 30100

