apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-backend-deployment
  labels:
    app: my-app-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app-backend
  template:
    metadata:
      labels:
        app: my-app-backend
    spec:
      containers:
      - name: my-app-backend
        image: my-app-backend
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: MONGO_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo-user
        - name: MONGO_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongo-secret
              key: mongo-password
        - name: MONGO_URI
          value: mongodb://$(MONGO_DB_USERNAME):$(MONGO_DB_PASSWORD)@mongodb:27017/
---
apiVersion: v1
kind: Service
metadata:
  name: app-backend
spec:
  selector:
    app: my-app-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000


