services:
  my-app-frontend:
    build:
      context: ./frontend
    image: my-app-frontend
    ports:
     - 7860:7860
    environment:
     - BACKEND_HOST_URL=http://my-app-backend:8000
    networks:
     - mynetwork
    depends_on:
     - my-app-backend
  
  my-app-backend:
    build:
      context: ./backend
    image: my-app-backend
    ports:
     - 8000:8000
    environment:
     - MONGO_DB_USERNAME=admin
     - MONGO_DB_PASSWORD=password
     - MONGO_URI=mongodb://admin:password@mongodb:27017/
    networks:
     - mynetwork
    depends_on:
     - mongodb

  mongo-express:
    image: mongo-express
    ports:
     - 8081:8081
    environment:
     - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
     - ME_CONFIG_MONGODB_ADMINPASSWORD=password
     - ME_CONFIG_MONGODB_URL=mongodb://admin:password@mongodb:27017/
    networks:
     - mynetwork
    depends_on:
     - mongodb
     
  mongodb:
    image: mongo
    ports:
     - 27017:27017
    environment:
     - MONGO_INITDB_ROOT_USERNAME=admin
     - MONGO_INITDB_ROOT_PASSWORD=password
    networks:
     - mynetwork
    volumes:
     - my_data:/data/db

networks:
  mynetwork:
    driver: bridge
 
volumes:
  my_data:
